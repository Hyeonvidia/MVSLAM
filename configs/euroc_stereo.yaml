# MVSLAM configuration — EuRoC MAV, stereo without IMU (values from the ORB-SLAM3 / OV2SLAM EuRoC files).
schema: 1
sensor: stereo          # mono | stereo | rgbd
inertial: none          # none | imu (this preset: stereo only; see euroc_stereo_imu.yaml)
execution: realtime     # realtime | offline (deterministic, synchronous workers)
rng_seed: 0
rig:
  cameras:
    - model: pinhole
      width: 752
      height: 480
      intrinsics: [458.654, 457.296, 367.215, 248.375]
      distortion: [-0.28340811, 0.07395907, 0.00019359, 1.76187114e-05]
      fps: 20
      T_bc: [0.0148655429818, -0.999880929698, 0.00414029679422, -0.0216401454975,
             0.999557249008, 0.0149672133247, 0.025715529948, -0.064676986768,
             -0.0257744366974, 0.00375618835797, 0.999660727178, 0.00981073058949,
             0.0, 0.0, 0.0, 1.0]
    - model: pinhole
      width: 752
      height: 480
      intrinsics: [457.587, 456.134, 379.999, 255.238]
      distortion: [-0.28368365, 0.07451284, -0.00010473, -3.55590700e-05]
      fps: 20
      T_bc: [0.0125552670891, -0.999755099723, 0.0182237714554, -0.0198435579556,
             0.999598781151, 0.0130119051815, 0.0251588363115, 0.0453689425024,
             -0.0253898008918, 0.0179005838253, 0.999517347078, 0.00786212447038,
             0.0, 0.0, 0.0, 1.0]
  imu:
    rate_hz: 200
    noise_gyro: 1.7e-4
    noise_acc: 2.0e-3
    walk_gyro: 1.9393e-5
    walk_acc: 3.0e-3
    gravity: 9.81
frontend:
  clahe: true
  clahe_clip: 3.0
  klt_window: 9
  klt_levels: 3
  klt_fb_max_px: 0.5
  kf_min_parallax_px: 20.0
  kf_stereo_force_s: 0.25         # keyframe at least every 0.25 s (the P0 gate was measured with this cadence, then implied by inertial: imu)
  kf_imu_interval_s: 0.5
  close_depth_factor: 60.0
  detector_cell_px: 35
backend:
  solver: ceres            # ceres | g2o | gtsam (adapters compiled in with MVSLAM_WITH_*)
  lba_max_keyframes: 20
  lba_max_time_s: 0.2
  inertial_window: 10
  inertial_window_large: 25
  solver_threads: 1
loop:
  enable: true
  recognizer: incremental   # none | incremental (HBST, no vocabulary) | dbow (P3)
  loose_ba_threshold: 0.02
map:
  multi_map: true
  retention_s: 5.0
logging:
  level: info
